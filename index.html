<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Заправка в рейсе</title>

    <style>
        :root {
            --brand: #ff6200;
            --brand-soft: #fff0e6;
            --ink: #000;
            --sub: #64748b;
            --bg: #f5f5f5;
            --ok: #16a34a;
            --ok-soft: #e8f7ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #e9ebef;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, sans-serif;
            color: var(--ink);
        }

        .screen {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(17, 24, 39, .08);
        }

        .status {
            height: 47px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 28px 8px;
            font-size: 15px;
            font-weight: 600;
            flex: none;
        }

        .content {
            flex: 1;
            min-height: 0;
            padding: 4px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin: 4px 0 0;
        }

        .muted {
            color: var(--sub);
            font-size: 12px;
        }

        .card {
            background: var(--bg);
            border-radius: 16px;
            padding: 16px;
        }

        .route {
            font-size: 20px;
            font-weight: 600;
            margin: 4px 0;
        }

        .limit {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -.5px;
        }

        .progress {
            height: 6px;
            background: #e3e6eb;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress i {
            display: block;
            height: 100%;
            background: var(--brand);
        }

        .btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--brand);
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            border: none;
            border-radius: 999px;
            padding: 16px;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .bottom {
            padding: 12px 24px 24px;
            flex: none;
        }

        .summary .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            gap: 12px;
        }

        .summary .row span:first-child {
            color: var(--sub);
        }

        .center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
        }

        .okicon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--ok-soft);
            color: var(--ok);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
        }

        .big {
            font-size: 24px;
            font-weight: 700;
        }

        .note {
            border-left: 3px solid var(--brand);
            background: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            color: #4b5563;
        }

        @media (max-width: 430px) {
            .screen {
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <main id="app" class="screen">
        <div class="content">
            <div class="title">Заправка в рейсе</div>
            <div class="muted">Загрузка приложения...</div>
        </div>
    </main>

    <script src="fake-api.js"></script>
    <script src="app.js"></script>
</body>
</html>
